name: Spur 8GPU smoke

on:
  workflow_dispatch:

jobs:
  smoke-8gpu:
    name: MI355X 8GPU smoke
    runs-on: [self-hosted, spur-runner-mi355x-8gpu]
    timeout-minutes: 30

    steps:
      - name: Show host
        run: |
          hostname
          whoami

      - name: Show Slurm environment
        run: |
          env | sort | grep -E '^(SLURM|SPUR|RUNNER|ROCR|HIP|CUDA)_' || true

      - name: Check GPUs
        run: |
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi
          else
            echo "rocm-smi not found"
          fi
